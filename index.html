<style>
:root{--bg:#f2f3f5;--card:#fff;--text:#15171a;--sub:#596170;--line:#d3d7dd;--accent:#d63a43}
@media (prefers-color-scheme:dark){:root{--bg:#0e1013;--card:#1a1d22;--text:#eceef1;--sub:#a4abb4;--line:#363b44;--accent:#ef5b62}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;background:var(--bg);
 font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;color:var(--text);
 padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
form{width:min(340px,86vw);text-align:center;margin-top:-12vh}
.mark{width:64px;height:64px;margin:0 auto 14px;border-radius:16px;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center}
.mark i{width:26px;height:26px;border-radius:50%;background:var(--accent)}
h1{font-size:22px;margin:0}
.sub{font-size:14px;color:var(--sub);margin:2px 0 18px}
input[type=password]{width:100%;font:inherit;font-size:18px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);outline:none}
input[type=password]:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
label{font-size:15px;color:var(--sub);display:inline-flex;align-items:center;gap:8px;margin:12px 0 16px;padding:4px 0}
label input{width:20px;height:20px;margin:0;accent-color:var(--accent)}
button{width:100%;font:inherit;font-size:17px;font-weight:600;min-height:50px;border:none;border-radius:12px;background:var(--accent);color:#fff}
button:disabled{opacity:.6}
#msg{color:var(--accent);min-height:1.5em;font-size:15px;margin-top:10px}
#msg.ok{color:var(--sub)}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
body.auto form>*:not(.mark):not(h1):not(#msg){visibility:hidden}
</style></head><body>

const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(P.s),iterations:P.i,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(P.v)},k,u(P.c));
  return new TextDecoder().decode(pt);
}
async function go(pw,auto){
  const m=document.getElementById("msg"), btn=document.getElementById("go"), inp=document.getElementById("pw");
  if(!window.crypto||!crypto.subtle){m.textContent="请用 https 网址打开";return;}
  if(!pw){m.textContent="先输入密码";inp.focus();return;}
  m.className="ok"; m.textContent="正在打开…"; btn.disabled=true; btn.textContent="正在打开…";
  if(auto) document.body.classList.add("auto");
  try{ const h=await open_(pw);
    if(document.getElementById("rem").checked) localStorage.setItem("jp26:pw",pw);
    document.open(); document.write(h); document.close();
  }catch(e){
    btn.disabled=false; btn.textContent="打开"; document.body.classList.remove("auto"); m.className="";
    if(auto){localStorage.removeItem("jp26:pw");m.textContent="";}
    else { m.textContent="密码不对，再试一次"; const f=document.getElementById("f"); f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake"); inp.select(); }
  }
}
document.getElementById("f").onsubmit=e=>{e.preventDefault();go(document.getElementById("pw").value.trim());};
const saved=localStorage.getItem("jp26:pw"); if(saved) go(saved,true);
